<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA DE RECEBIMENTO | BELT</title>

    <!-- PWA & Tags Nativas Mobile -->
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BELT NF-e">

    <!-- Favicon e Ícones PWA dinâmicos em SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M3 7V5a2 2 0 0 1 2-2h2'></path><path d='M17 3h2a2 2 0 0 1 2 2v2'></path><path d='M21 17v2a2 2 0 0 1-2 2h-2'></path><path d='M7 21H5a2 2 0 0 1-2-2v-2'></path><path d='M7 8v8M10.5 8v8M14 8v8M17 8v8'></path></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M3 7V5a2 2 0 0 1 2-2h2'></path><path d='M17 3h2a2 2 0 0 1 2 2v2'></path><path d='M21 17v2a2 2 0 0 1-2 2h-2'></path><path d='M7 21H5a2 2 0 0 1-2-2v-2'></path><path d='M7 8v8M10.5 8v8M14 8v8M17 8v8'></path></svg>">

    <!-- Manifest PWA gerado inline -->
    <script>
        const manifestData = {
            "name": "SISTEMA DE RECEBIMENTO BELT",
            "short_name": "BELT NF-e",
            "description": "Registro e leitura de chaves de acesso NF-e",
            "start_url": "./index.html",
            "display": "standalone",
            "orientation": "any",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "lang": "pt-BR"
        };
        const stringManifest = JSON.stringify(manifestData);
        const blobManifest = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blobManifest);
        const linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = manifestURL;
        document.head.appendChild(linkManifest);
    </script>

    <!-- Leitor QR / Barcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --bg-body: #0f172a;
            --surface: #1e293b;
            --surface-card: #0f172a;
            --border: #334155;
            --border-focus: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.12);
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .offline-badge {
            display: none;
            background-color: var(--warning-bg);
            color: var(--warning);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--warning);
        }

        .offline-badge.visible {
            display: block;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .brand-title span { color: var(--accent); }

        .badge-online {
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--border-focus);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }

        /* Gerenciamento de Páginas/Etapas */
        .step-page {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .step-page.active {
            display: flex;
        }

        .operator-info {
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .operator-info span {
            color: var(--border-focus);
            font-weight: 700;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-decoration: underline;
            cursor: pointer;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px dashed var(--border);
            background: #000;
            min-height: 200px;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover;
        }

        .camera-controls {
            display: flex;
            gap: 8px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--border-focus);
        }

        .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-accent { background-color: var(--accent); color: #ffffff; }
        .btn-accent:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: #334155; color: var(--text-primary); }
        .btn-torch { background-color: #475569; color: #fbbf24; width: 30%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-msg {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            display: none;
            line-height: 1.3;
            word-break: break-word;
        }

        .status-success { background-color: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
        .status-error { background-color: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .status-warning { background-color: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media screen and (orientation: landscape) {
            body { padding: 4px; }
            .app-container { max-width: 100%; padding: 12px; }
            #reader { min-height: 160px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="offlineBadge" class="offline-badge">
        ⚠️ Você está Offline (Registros serão salvos no dispositivo)
    </div>

    <header>
        <div class="brand-title">RECEBIMENTO <span>NF-e</span></div>
        <div class="badge-online" id="statusBadge">SISTEMA ATIVO</div>
    </header>

    <!-- ETAPA 1: SELEÇÃO DO OPERADOR -->
    <div id="step1" class="step-page active">
        <form id="step1Form" onsubmit="avancarParaEtapa2(event)">
            <div class="field-group">
                <label for="usuarioSelect">Operador Responsável</label>
                <select id="usuarioSelect" required>
                    <option value="">-- SELECIONE SEU NOME --</option>
                </select>
            </div>
            <button type="submit" class="btn btn-accent">Avançar ➔</button>
        </form>
    </div>

    <!-- ETAPA 2: DIGITAÇÃO E LEITURA DA CHAVE -->
    <div id="step2" class="step-page">
        <div class="operator-info">
            <div>Operador: <span id="displayOperator"></span></div>
            <button type="button" class="btn-link" onclick="voltarParaEtapa1()">Alterar</button>
        </div>

        <div id="reader"></div>

        <div class="camera-controls">
            <button id="btn-scan" class="btn btn-secondary" onclick="toggleScanner()" style="flex: 1;">⏹ Desativar Câmera</button>
            <button id="btn-torch" class="btn btn-torch" onclick="alternarLanterna()" title="Ligar Lanterna">🔦</button>
        </div>

        <form id="nfForm" onsubmit="enviarDados(event)">
            <div class="field-group">
                <label for="chaveAcesso">Chave de Acesso (44 Dígitos)</label>
                <input type="text" id="chaveAcesso" name="chaveAcesso" required maxlength="44" placeholder="Aguardando scanner ou digitação..." pattern="[0-9]{44}" inputmode="numeric">
            </div>

            <button type="submit" id="btn-submit" class="btn btn-accent">
                <span id="btnText">💾 Gravar Registro</span>
            </button>
        </form>
    </div>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqQUQIhZYJ441ue89OuEVYf1z_dvLXVH0Z8kDqadyAKCXSWev-qFfydgsQI3CIe318/exec";

    const USUARIOS_PERMITIDOS = [
        "MICKAEL KALIL WAGNER DE OLIVEIRA",
        "ARTHUR PEREIRA WEBER",
        "GABRIEL GONCALVES PERES",
        "LUAN DE FRAGA OLIVEIRA",
        "RIQUELMI MOREIRA DOS SANTOS"
    ];

    let html5QrcodeScanner = null;
    let isScanning = false;
    let isTorchOn = false;
    let audioCtx = null;
    let operadorAtual = "";

    document.getElementById('chaveAcesso').addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
    });

    window.onload = function() {
        carregarListaUsuarios();
        atualizarStatusConexao();
    };

    function atualizarStatusConexao() {
        const badge = document.getElementById('offlineBadge');
        const statusBadge = document.getElementById('statusBadge');
        if (!navigator.onLine) {
            badge.classList.add('visible');
            statusBadge.innerText = "MODO OFFLINE";
            statusBadge.style.color = "var(--warning)";
            statusBadge.style.borderColor = "var(--warning)";
        } else {
            badge.classList.remove('visible');
            statusBadge.innerText = "SISTEMA ATIVO";
            statusBadge.style.color = "var(--border-focus)";
            statusBadge.style.borderColor = "rgba(56, 189, 248, 0.3)";
            sincronizarFilaOffline();
        }
    }
    window.addEventListener('online', atualizarStatusConexao);
    window.addEventListener('offline', atualizarStatusConexao);

    function carregarListaUsuarios() {
        const select = document.getElementById("usuarioSelect");
        USUARIOS_PERMITIDOS.forEach(nome => {
            const opt = document.createElement("option");
            opt.value = nome;
            opt.textContent = nome;
            select.appendChild(opt);
        });

        const ultimoUsuario = localStorage.getItem("ultimo_operador_nfe");
        if (ultimoUsuario && USUARIOS_PERMITIDOS.includes(ultimoUsuario)) {
            select.value = ultimoUsuario;
        }
    }

    function avancarParaEtapa2(e) {
        e.preventDefault();
        const select = document.getElementById("usuarioSelect");
        if (!select.value) {
            showStatus("Selecione um operador para continuar.", "error");
            return;
        }

        operadorAtual = select.value;
        localStorage.setItem("ultimo_operador_nfe", operadorAtual);
        document.getElementById("displayOperator").innerText = operadorAtual;

        document.getElementById("step1").classList.remove("active");
        document.getElementById("step2").classList.add("active");

        setTimeout(() => { startScanner(); }, 300);
    }

    function voltarParaEtapa1() {
        stopScanner();
        document.getElementById("step2").classList.remove("active");
        document.getElementById("step1").classList.active = false;
        document.getElementById("step1").classList.add("active");
    }

    function toggleScanner() {
        prepararAudio();
        if (isScanning) stopScanner();
        else startScanner();
    }

    async function startScanner() {
        prepararAudio();

        if (html5QrcodeScanner) {
            try { await html5QrcodeScanner.stop(); } catch(e) {}
            try { await html5QrcodeScanner.clear(); } catch(e) {}
        }

        html5QrcodeScanner = new Html5Qrcode("reader", { verbose: false });

        // Retângulo estreito e largo ideal para o código Code-128 de 44 dígitos da DANFE
        const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
            let width = Math.floor(viewfinderWidth * 0.92);
            let height = Math.max(90, Math.floor(viewfinderHeight * 0.25));
            return { width: width, height: height };
        };

        const config = { 
            fps: 30, // Frequência alta para captura rápida
            qrbox: qrboxFunction,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.QR_CODE
            ]
        };

        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        )
        .then(() => {
            isScanning = true;
            document.getElementById("btn-scan").innerText = "⏹ Desativar Câmera";
        })
        .catch(err => {
            showStatus("Permissão de câmera negada ou dispositivo incompatível.", "error");
        });
    }

    function stopScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                html5QrcodeScanner.clear();
                isScanning = false;
                isTorchOn = false;
                document.getElementById("btn-scan").innerText = "📷 Ativar Câmera";
            }).catch(() => {
                isScanning = false;
                document.getElementById("btn-scan").innerText = "📷 Ativar Câmera";
            });
        }
    }

    function alternarLanterna() {
        if (html5QrcodeScanner && isScanning) {
            isTorchOn = !isTorchOn;
            html5QrcodeScanner.applyVideoConstraints({
                advanced: [{ torch: isTorchOn }]
            }).catch(() => {
                showStatus("Lanterna não suportada neste dispositivo.", "warning");
            });
        }
    }

    function onScanSuccess(decodedText) {
        let cleanText = decodedText.replace(/\D/g, '');
        if (cleanText.length === 44) {
            tocarBip();
            if (navigator.vibrate) navigator.vibrate(200);

            document.getElementById("chaveAcesso").value = cleanText;
            stopScanner();
            showStatus("✅ Chave lida com sucesso!", "success");
        }
    }

    async function enviarDados(e) {
        e.preventDefault();

        const chaveVal = document.getElementById("chaveAcesso").value.replace(/\D/g, '');

        if (!operadorAtual) {
            showStatus("Sessão inválida. Retorne à seleção de operador.", "error");
            voltarParaEtapa1();
            return;
        }

        if (chaveVal.length !== 44) {
            showStatus("A chave deve conter exatamente 44 dígitos.", "error");
            return;
        }

        setLoading(true);

        if (!navigator.onLine) {
            salvarFilaOffline(chaveVal, operadorAtual);
            showStatus("⚠️ Registro salvo offline. Será transmitido assim que houver conexão.", "warning");
            document.getElementById("chaveAcesso").value = "";
            setLoading(false);
            startScanner();
            return;
        }

        try {
            await requisitarEnvio(chaveVal, operadorAtual);
            showStatus("✅ Registrado com sucesso!", "success");
            document.getElementById("chaveAcesso").value = "";
            startScanner();
        } catch (err) {
            salvarFilaOffline(chaveVal, operadorAtual);
            showStatus("⚠️ Erro na rede. Registro salvo offline para envio automático.", "warning");
            document.getElementById("chaveAcesso").value = "";
            startScanner();
        } finally {
            setLoading(false);
        }
    }

    async function requisitarEnvio(chaveAcesso, usuario) {
        const response = await fetch(WEB_APP_URL, {
            method: "POST",
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ chaveAcesso: chaveAcesso, usuario: usuario })
        });
        const data = await response.json();
        if (data.status !== "success") {
            throw new Error(data.error || "Erro no envio");
        }
        return data;
    }

    function salvarFilaOffline(chaveAcesso, usuario) {
        const fila = JSON.parse(localStorage.getItem('nfe_pendentes') || '[]');
        fila.push({ chaveAcesso: chaveAcesso, usuario: usuario, timestamp: new Date().toISOString() });
        localStorage.setItem('nfe_pendentes', JSON.stringify(fila));
    }

    async function sincronizarFilaOffline() {
        const fila = JSON.parse(localStorage.getItem('nfe_pendentes') || '[]');
        if (fila.length === 0) return;

        showStatus(`Sincronizando ${fila.length} registro(s) offline...`, "warning");

        const naoEnviados = [];
        for (const item of fila) {
            try {
                await requisitarEnvio(item.chaveAcesso, item.usuario);
            } catch (e) {
                naoEnviados.push(item);
            }
        }

        localStorage.setItem('nfe_pendentes', JSON.stringify(naoEnviados));

        if (naoEnviados.length === 0) {
            showStatus("✅ Todos os registros offline foram sincronizados!", "success");
        } else {
            showStatus(`⚠️ Restam ${naoEnviados.length} registro(s) pendentes.`, "warning");
        }
    }

    function setLoading(isLoading) {
        const btnSubmit = document.getElementById("btn-submit");
        const btnText = document.getElementById("btnText");
        btnSubmit.disabled = isLoading;
        if (isLoading) {
            btnText.innerHTML = '<span class="spinner"></span> Salvando...';
        } else {
            btnText.innerHTML = '💾 Gravar Registro';
        }
    }

    function showStatus(msg, type) {
        const el = document.getElementById("statusMsg");
        el.innerText = msg;
        el.className = "status-msg status-" + type;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    function prepararAudio() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
    }

    function tocarBip() {
        try {
            if (!audioCtx) return;
            const oscilador = audioCtx.createOscillator();
            const ganho = audioCtx.createGain();
            oscilador.connect(ganho);
            ganho.connect(audioCtx.destination);
            oscilador.type = 'sine';
            oscilador.frequency.value = 880;
            ganho.gain.setValueAtTime(0.25, audioCtx.currentTime);
            oscilador.start();
            oscilador.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE = 'belt-nfe-v6';
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./index.html', './'])).then(() => self.skipWaiting()));
                });
                self.addEventListener('activate', e => {
                    e.waitUntil(caches.keys().then(keys => Promise.all(
                        keys.filter(k => k !== CACHE).map(k => caches.delete(k))
                    )).then(() => self.clients.claim()));
                });
                self.addEventListener('fetch', e => {
                    if (e.request.method !== 'GET') return;
                    const url = new URL(e.request.url);
                    if (url.hostname.includes('script.google.com') || url.hostname.includes('googleusercontent.com')) return;
                    e.respondWith(
                        caches.match(e.request).then(cached => {
                            const networked = fetch(e.request).then(res => {
                                const cacheCopy = res.clone();
                                caches.open(CACHE).then(c => c.put(e.request, cacheCopy));
                                return res;
                            }).catch(() => cached);
                            return cached || networked;
                        })
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.error('SW Error:', err));
        });
    }
</script>
</body>
</html>
